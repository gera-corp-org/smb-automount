name: Strip asset labels

# One-shot maintenance: v1.0.0 and v1.1.0 were published with "file#label"
# asset labels, and a label is what GitHub shows in place of the file name in
# the release links. This clears them; the release workflow no longer sets any.
# Delete this file once it has run.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Clear the label on every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          for rel in $(gh api "/repos/$REPO/releases" --paginate --jq '.[].id'); do
            tag=$(gh api "/repos/$REPO/releases/$rel" --jq '.tag_name')
            for asset in $(gh api "/repos/$REPO/releases/$rel/assets" --paginate \
                             --jq '.[] | select(.label != null and .label != "") | .id'); do
              name=$(gh api "/repos/$REPO/releases/assets/$asset" --jq '.name')
              echo '{"label":""}' \
                | gh api --method PATCH "/repos/$REPO/releases/assets/$asset" --input - >/dev/null
              echo "$tag: cleared the label on $name"
            done
          done
