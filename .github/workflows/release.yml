name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Nothing in the release is compiled, so there is one set of artifacts for
  # both Mac architectures — but it only goes out after passing on both.
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            machine: arm64
          - name: Intel
            runner: macos-15-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || {
            echo "tag $GITHUB_REF_NAME does not match VERSION ($file)" >&2
            exit 1
          }

      - name: Really this architecture
        run: |
          got=$(uname -m)
          echo "machine: $got"
          [ "$got" = "${{ matrix.machine }}" ] || {
            echo "expected ${{ matrix.machine }}, the runner is $got" >&2
            exit 1
          }

      - name: Tests
        run: /bin/bash tests/run-tests.sh

      - name: Build
        run: /bin/bash build/build.sh

  publish:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: /bin/bash build/build.sh

      - name: Release notes
        run: |
          {
            /bin/bash build/release-notes.sh "$GITHUB_REF_NAME"
            echo
            cat build/release-footer.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No "file#label" here: a label replaces the file name in the release
          # links, and the file name — which carries the version — is what a
          # person needs to see.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.zip \
            dist/smb-automount-install-*.sh
